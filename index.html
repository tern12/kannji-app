<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢字アプリ</title>
<!--
  漢字アプリ(最初の版)

  書き順のデータは KanjiVG を使っています。
    https://kanjivg.tagaini.net/
    Copyright (C) 2009/2010/2011 Ulrich Apel.
    Creative Commons Attribution-Share Alike 3.0
    https://creativecommons.org/licenses/by-sa/3.0/
  このファイルの「③ 書き順のデータ」の部分も CC BY-SA 3.0 です。
-->
<style>
  /* ===== 全体 ===== */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    color: #222;
    background: #fafafa;
    -webkit-text-size-adjust: 100%;
  }
  .screen { max-width: 480px; margin: 0 auto; padding: 12px 16px 40px; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }

  /* ===== はじめの画面: 言語を聞く ===== */
  .lang-question { margin: 48px 0 28px; font-size: 18px; line-height: 2; text-align: center; }
  .lang-question span { display: inline-block; } /* 折り返すときは、言語の区切りで */
  .lang-choices { display: flex; flex-direction: column; gap: 12px; }
  .lang-choices button { padding: 14px 0; border: 1px solid #999; background: none; border-radius: 8px; }

  /* ===== 選んでいる印(言語・タブ): 下線。選んでいないほうは文字だけ ===== */
  .lang-switch, .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .lang-switch button, .tabs button { border: 0; border-bottom: 3px solid transparent; background: none; color: #777; }
  .lang-switch button.active, .tabs button.active { color: #222; border-bottom-color: #333; }
  .lang-switch { justify-content: flex-end; }          /* 一覧の言語ボタンは、右上に小さく */
  .lang-switch button { padding: 6px 8px; font-size: 13px; }
  .tabs button { flex: 1; padding: 10px 0; }

  /* ===== 画面1: 一覧 ===== */

  .kanji-list { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 8px; }
  .kanji-list li + li { border-top: 1px solid #eee; }
  .kanji-list button {
    display: flex; align-items: center; width: 100%;
    padding: 10px 16px; border: 0; background: none; text-align: left;
  }
  .kanji-list .k { font-size: 32px; width: 60px; }
  .kanji-list .y { color: #555; }
  .kanji-list .n { margin-left: auto; padding-left: 8px; font-size: 12px; color: #888; white-space: nowrap; } /* 画数 */

  .credit { margin-top: 20px; font-size: 12px; color: #777; line-height: 1.6; }
  .credit a { color: #777; }

  /* ===== 画面2: 漢字の画面 ===== */
  .back { border: 0; background: none; padding: 8px 0; color: #2a62c9; }
  .head { margin: 4px 0 12px; }
  .meaning { font-size: 20px; font-weight: bold; }
  .reading { color: #555; margin-top: 4px; }
  .tag { font-size: 12px; font-weight: normal; color: #777; margin-right: 6px; } /* 「意味」「読み」「音1」「例1」などの小さい見出し */

  /* 大きい枠(見ると書くで同じ枠を使う) */
  #frame {
    display: block; width: 100%; max-width: 360px; aspect-ratio: 1 / 1; margin: 0 auto;
    background: #fff; border: 2px solid #999; border-radius: 4px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #frame.writing { touch-action: none; } /* 書くときは、指で画面がスクロールしないように */
  #frame .guide { stroke: #bbb; stroke-width: 0.6; stroke-dasharray: 2 2; }
  #frame path { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  #frame .model-stroke { stroke: #ddd; }           /* 見本(薄いグレー) */
  #frame .model-stroke.next { stroke: #f2a65a; }   /* 次に書く画 */
  #frame .anim-stroke { stroke: #222; }            /* アニメの線 */
  #frame .ink-stroke { stroke: #2a62c9; }          /* 自分で書いた線 */

  .controls { display: flex; gap: 8px; justify-content: center; margin: 12px 0 8px; }
  .controls button { min-width: 120px; padding: 10px 14px; border: 1px solid #999; background: none; border-radius: 8px; }
  #start-btn { background: #333; border-color: #333; color: #fff; } /* 濃いベタは「スタート(もう一度)」だけ */

  /* 書き終わったら出る「次はこれ」 */
  .related { margin-top: 12px; }
  .related:not(.hidden) { animation: fade-in 0.3s ease-out; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } }
  .related-title { margin-bottom: 6px; font-size: 14px; color: #777; text-align: center; }
  .related-list { display: flex; gap: 8px; }
  .related-list button { flex: 1; min-width: 0; padding: 8px 4px; border: 1px solid #999; background: none; border-radius: 8px; }
  .related-list span { display: block; }
  .related-list .rk { font-size: 28px; }
  .related-list .rm { font-size: 12px; color: #666; line-height: 1.4; overflow-wrap: anywhere; }

  /* 読み・例文 */
  h2 { font-size: 16px; margin: 24px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #ddd; }
  .yomi-row { display: flex; align-items: baseline; margin: 14px 0; line-height: 2; }
  .yomi-row .tag { flex: none; width: 36px; margin-right: 0; }  /* 番号。読みの左端がそろうように幅を決める */
  .yomi-body { flex: 1; min-width: 0; }                         /* 読み(1行目)と単語(2行目)。幅が足りないと単語は折り返す */
  .yomi { font-weight: bold; }
  .words { margin-top: 2px; }
  .word, .forms { display: inline-block; margin-right: 16px; }
  .tr { color: #666; font-size: 14px; }
  .oku { color: #d9534f; }                           /* 送り仮名の色 */
  .sentence { margin: 12px 0; }
  .sentence .ja { font-size: 18px; line-height: 2.2; }
  rt { font-size: 0.55em; color: #555; }
  .empty { color: #999; }
</style>
</head>
<body>

<!-- ===== はじめの画面: 言語を聞く(言語が保存されていないときだけ) ===== -->
<div id="lang-screen" class="screen hidden">
  <p class="lang-question">
    <span lang="ja">何語を話しますか /</span>
    <span lang="en">What language do you speak? /</span>
    <span lang="es">¿Qué idioma hablas?</span>
  </p>
  <div class="lang-choices" id="lang-choices">
    <button data-lang="ja">日本語</button>
    <button data-lang="en">English</button>
    <button data-lang="es">Español</button>
  </div>
</div>

<!-- ===== 画面1: 一覧 ===== -->
<div id="list-screen" class="screen">
  <div class="lang-switch" id="lang-switch">
    <button data-lang="ja">日本語</button>
    <button data-lang="en">English</button>
    <button data-lang="es">Español</button>
  </div>

  <ul class="kanji-list" id="kanji-list"></ul>

  <p class="credit">
    <span id="credit-text"></span><br>
    KanjiVG © Ulrich Apel ·
    <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">kanjivg.tagaini.net</a> ·
    <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>
  </p>
</div>

<!-- ===== 画面2: 漢字の画面 ===== -->
<div id="kanji-screen" class="screen hidden">
  <button class="back" id="back-btn"></button>

  <div class="head">
    <div class="meaning" id="meaning"></div>
    <div class="reading" id="reading"></div>
  </div>

  <div class="tabs">
    <button id="tab-see"></button>
    <button id="tab-write"></button>
  </div>

  <svg id="frame" viewBox="0 0 109 109" xmlns="http://www.w3.org/2000/svg">
    <line class="guide" x1="54.5" y1="0" x2="54.5" y2="109"/>
    <line class="guide" x1="0" y1="54.5" x2="109" y2="54.5"/>
    <g id="model"></g>  <!-- 見本 -->
    <g id="anim"></g>   <!-- 書き順のアニメ -->
    <g id="ink"></g>    <!-- 自分で書いた線 -->
  </svg>

  <!-- 見るのときのボタン -->
  <div class="controls" id="see-controls">
    <button id="start-btn"></button>
    <button id="next-btn"></button>
  </div>
  <!-- 書くのときのボタン -->
  <div class="controls hidden" id="write-controls">
    <button id="model-btn"></button>
    <button id="clear-btn"></button>
  </div>
  <!-- 書き終わったら出る: 次はこれ(関連する字を3つ) -->
  <div class="related hidden" id="related">
    <div class="related-title" id="related-title"></div>
    <div class="related-list" id="related-list"></div>
  </div>

  <h2 id="on-title"></h2>
  <div id="on-list"></div>

  <h2 id="kun-title"></h2>
  <div id="kun-list"></div>

  <h2 id="ex-title"></h2>
  <div id="ex-list"></div>
</div>

<script>
// =====================================================
// ① 漢字のデータ(3.4・3.5で、ここを増やしたり直したりする)
//
//   k    : 漢字
//   yomi : 一覧と画面2のいちばん上に出す読み
//   mean : 意味(ja 日本語 / en 英語 / es スペイン語)
//   on   : 音読み。words は例の言葉
//   kun  : 訓読み。yomi の [ ] の中が送り仮名(赤くなる)。forms の [ ] は位置を示すだけで、表示では黒。
//          words は例の言葉(音読みの words と同じ形。なくてもよい)。
//          送り仮名がない読み(forms に [ ] がない)は、words があれば forms は出さない
//   ex   : 例文。{漢字|ふりがな} と書くと、漢字の上にふりがなが付く
//
//   例文は今は見本の3字(行・飲・病)だけ。ほかは 3.4 で入れる
// =====================================================
const KANJI = [
  // ---------- 動詞 ----------
  {
    k: "行", yomi: "いく・コウ",
    mean: { ja: "いく。おこなう", en: "go; do", es: "ir; hacer" },
    on: [
      { yomi: "コウ", words: [
        { w: "{銀行|ぎんこう}", en: "bank", es: "banco" },
        { w: "{旅行|りょこう}", en: "trip", es: "viaje" },
      ] },
      { yomi: "ギョウ", words: [
        { w: "{行列|ぎょうれつ}", en: "line (of people)", es: "fila (de gente)" },
      ] },
    ],
    kun: [
      { yomi: "い[く]", forms: "行[く]・行[きます]" },
      { yomi: "おこな[う]", forms: "行[う]・行[います]" },
    ],
    ex: [
      { ja: "{病院|びょういん}に{行|い}きます。", en: "I go to the hospital.", es: "Voy al hospital." },
      { ja: "{店|みせ}の{前|まえ}に{行列|ぎょうれつ}があります。", en: "There is a line in front of the shop.", es: "Hay una fila delante de la tienda." },
    ],
  },
  {
    k: "食", yomi: "たべる・ショク",
    mean: { ja: "たべる。たべもの", en: "eat; food", es: "comer; comida" },
    on: [
      { yomi: "ショク", words: [
        { w: "{食事|しょくじ}", en: "meal", es: "comida" },
        { w: "{食堂|しょくどう}", en: "cafeteria", es: "comedor" },
      ] },
    ],
    kun: [ { yomi: "た[べる]", forms: "食[べる]・食[べます]" } ],
    ex: [
      { ja: "{薬|くすり}は{食後|しょくご}に{飲|の}みます。", en: "I take the medicine after meals.", es: "Tomo la medicina después de comer." },
      { ja: "{家|いえ}で{野菜|やさい}を{食|た}べます。", en: "I eat vegetables at home.", es: "Como verduras en casa." },
    ],
  },
  {
    k: "飲", yomi: "のむ・イン",
    mean: { ja: "のむ", en: "drink", es: "beber" },
    on: [
      { yomi: "イン", words: [
        { w: "{飲食店|いんしょくてん}", en: "restaurant", es: "restaurante" },
      ] },
    ],
    kun: [ { yomi: "の[む]", forms: "飲[む]・飲[みます]" } ],
    ex: [
      { ja: "{薬|くすり}を{飲|の}みます。", en: "I take medicine.", es: "Tomo la medicina." },
      { ja: "{水|みず}を{飲|の}みます。", en: "I drink water.", es: "Bebo agua." },
    ],
  },
  {
    k: "買", yomi: "かう・バイ",
    mean: { ja: "かう", en: "buy", es: "comprar" },
    on: [
      { yomi: "バイ", words: [
        { w: "{売買|ばいばい}", en: "buying and selling", es: "compraventa" },
      ] },
    ],
    kun: [ { yomi: "か[う]", forms: "買[う]・買[います]" } ],
    ex: [
      { ja: "スーパーで{牛乳|ぎゅうにゅう}を{買|か}います。", en: "I buy milk at the supermarket.", es: "Compro leche en el supermercado." },
      { ja: "{薬局|やっきょく}で{薬|くすり}を{買|か}いました。", en: "I bought medicine at the pharmacy.", es: "Compré medicina en la farmacia." },
    ],
  },
  {
    k: "読", yomi: "よむ・ドク",
    mean: { ja: "よむ", en: "read", es: "leer" },
    on: [
      { yomi: "ドク", words: [
        { w: "{読書|どくしょ}", en: "reading (books)", es: "lectura" },
      ] },
    ],
    kun: [ { yomi: "よ[む]", forms: "読[む]・読[みます]" } ],
    ex: [
      { ja: "{薬|くすり}の{説明|せつめい}を{読|よ}みます。", en: "I read the instructions for the medicine.", es: "Leo las instrucciones de la medicina." },
      { ja: "{駅|えき}で{地図|ちず}を{読|よ}みます。", en: "I read the map at the station.", es: "Leo el mapa en la estación." },
    ],
  },
  {
    k: "書", yomi: "かく・ショ",
    mean: { ja: "かく", en: "write", es: "escribir" },
    on: [
      { yomi: "ショ", words: [
        { w: "{辞書|じしょ}", en: "dictionary", es: "diccionario" },
        { w: "{教科書|きょうかしょ}", en: "textbook", es: "libro de texto" },
      ] },
    ],
    kun: [ { yomi: "か[く]", forms: "書[く]・書[きます]" } ],
    ex: [
      { ja: "{受付|うけつけ}で{名前|なまえ}を{書|か}きます。", en: "I write my name at the reception desk.", es: "Escribo mi nombre en la recepción." },
      { ja: "{薬|くすり}の{袋|ふくろ}に{名前|なまえ}が{書|か}いてあります。", en: "The name is written on the medicine bag.", es: "El nombre está escrito en la bolsa de la medicina." },
    ],
  },
  {
    k: "入", yomi: "はいる・ニュウ",
    mean: { ja: "はいる。いれる", en: "enter; put in", es: "entrar; meter" },
    on: [
      { yomi: "ニュウ", words: [
        { w: "{入院|にゅういん}", en: "hospitalization", es: "hospitalización" },
        { w: "{入学|にゅうがく}", en: "entering school", es: "ingreso a la escuela" },
      ] },
    ],
    kun: [
      { yomi: "はい[る]", forms: "入[る]・入[ります]" },
      { yomi: "い[れる]", forms: "入[れる]・入[れます]" },
    ],
    ex: [
      { ja: "{店|みせ}に{入|はい}ります。", en: "I go into the shop.", es: "Entro en la tienda." },
      { ja: "{袋|ふくろ}に{野菜|やさい}を{入|い}れます。", en: "I put the vegetables in the bag.", es: "Meto las verduras en la bolsa." },
    ],
  },
  {
    k: "出", yomi: "でる・シュツ",
    mean: { ja: "でる。だす", en: "go out; take out", es: "salir; sacar" },
    on: [
      { yomi: "シュツ", words: [
        { w: "{出発|しゅっぱつ}", en: "departure", es: "salida" },
        { w: "{外出|がいしゅつ}", en: "going out", es: "salir (de casa)" },
      ] },
    ],
    kun: [
      { yomi: "で[る]", forms: "出[る]・出[ます]" },
      { yomi: "だ[す]", forms: "出[す]・出[します]" },
    ],
    ex: [
      { ja: "{病院|びょういん}を{出|で}て、{薬局|やっきょく}に{行|い}きます。", en: "I leave the hospital and go to the pharmacy.", es: "Salgo del hospital y voy a la farmacia." },
      { ja: "{受付|うけつけ}で{保険証|ほけんしょう}を{出|だ}します。", en: "I hand in my health insurance card at the reception desk.", es: "Entrego mi tarjeta del seguro médico en la recepción." },
    ],
  },
  {
    k: "売", yomi: "うる・バイ",
    mean: { ja: "うる", en: "sell", es: "vender" },
    on: [
      { yomi: "バイ", words: [
        { w: "{売店|ばいてん}", en: "kiosk; small shop", es: "quiosco; tienda pequeña" },
        { w: "{販売|はんばい}", en: "sales", es: "venta" },
      ] },
    ],
    kun: [ { yomi: "う[る]", forms: "売[る]・売[ります]" } ],
    ex: [
      { ja: "この{店|みせ}は{野菜|やさい}を{売|う}っています。", en: "This shop sells vegetables.", es: "Esta tienda vende verduras." },
      { ja: "{病院|びょういん}の{売店|ばいてん}で{水|みず}を{買|か}います。", en: "I buy water at the hospital kiosk.", es: "Compro agua en el quiosco del hospital." },
    ],
  },
  {
    k: "住", yomi: "すむ・ジュウ",
    mean: { ja: "すむ", en: "live (in a place)", es: "vivir (en un lugar)" },
    on: [
      { yomi: "ジュウ", words: [
        { w: "{住所|じゅうしょ}", en: "address", es: "dirección" },
      ] },
    ],
    kun: [ { yomi: "す[む]", forms: "住[む]・住[みます]" } ],
    ex: [
      { ja: "{駅|えき}の{近|ちか}くに{住|す}んでいます。", en: "I live near the station.", es: "Vivo cerca de la estación." },
      { ja: "{病院|びょういん}で{住所|じゅうしょ}を{書|か}きます。", en: "I write my address at the hospital.", es: "Escribo mi dirección en el hospital." },
    ],
  },

  // ---------- 名詞 ----------
  {
    k: "病", yomi: "ビョウ",
    mean: { ja: "びょうき", en: "illness", es: "enfermedad" },
    on: [
      { yomi: "ビョウ", words: [
        { w: "{病院|びょういん}", en: "hospital", es: "hospital" },
        { w: "{病気|びょうき}", en: "illness", es: "enfermedad" },
      ] },
    ],
    kun: [ { yomi: "やまい", forms: "病" } ],
    ex: [
      { ja: "{病院|びょういん}で{薬|くすり}をもらいます。", en: "I get medicine at the hospital.", es: "Recibo medicina en el hospital." },
      { ja: "{病気|びょうき}で{学校|がっこう}を{休|やす}みます。", en: "I miss school because I am sick.", es: "Falto a la escuela porque estoy enfermo." },
    ],
  },
  {
    k: "院", yomi: "イン",
    mean: { ja: "おおきな たてもの(びょういん など)", en: "institution (hospital, etc.)", es: "institución (hospital, etc.)" },
    on: [
      { yomi: "イン", words: [
        { w: "{病院|びょういん}", en: "hospital", es: "hospital" },
        { w: "{入院|にゅういん}", en: "hospitalization", es: "hospitalización" },
      ] },
    ],
    kun: [],
    ex: [
      { ja: "{病院|びょういん}は{何時|なんじ}からですか。", en: "What time does the hospital open?", es: "¿A qué hora abre el hospital?" },
      { ja: "{父|ちち}は{来週|らいしゅう}まで{入院|にゅういん}します。", en: "My father will be in the hospital until next week.", es: "Mi padre estará en el hospital hasta la próxima semana." },
    ],
  },
  {
    k: "薬", yomi: "くすり・ヤク",
    mean: { ja: "くすり", en: "medicine", es: "medicina" },
    on: [
      { yomi: "ヤク", words: [
        { w: "{薬局|やっきょく}", en: "pharmacy", es: "farmacia" },
      ] },
    ],
    kun: [
      { yomi: "くすり", forms: "薬", words: [
        { w: "{薬屋|くすりや}", en: "drugstore", es: "farmacia" },
      ] },
    ],
    ex: [
      { ja: "{薬局|やっきょく}で{薬|くすり}をもらいます。", en: "I get my medicine at the pharmacy.", es: "Recibo mi medicina en la farmacia." },
      { ja: "この{薬|くすり}は{一日|いちにち}{三回|さんかい}{飲|の}みます。", en: "I take this medicine three times a day.", es: "Tomo esta medicina tres veces al día." },
    ],
  },
  {
    k: "店", yomi: "みせ・テン",
    mean: { ja: "みせ", en: "shop", es: "tienda" },
    on: [
      { yomi: "テン", words: [
        { w: "{店員|てんいん}", en: "shop clerk", es: "dependiente" },
        { w: "{書店|しょてん}", en: "bookstore", es: "librería" },
      ] },
    ],
    kun: [
      { yomi: "みせ", forms: "店", words: [
        { w: "お{店|みせ}", en: "shop; store", es: "tienda; local" },
      ] },

<script>
// =====================================================
// ② アプリの動き
// =====================================================

// ---------- 小さな道具 ----------
function $(id) { return document.getElementById(id); }

function escapeHtml(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// {漢字|ふりがな} を <ruby> に変える
function toRuby(text) {
  return escapeHtml(text).replace(/\{([^|}]+)\|([^}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
}

// 行[く] の [ ] の中(送り仮名)に色を付ける
function toOkurigana(text) {
  return escapeHtml(text).replace(/\[([^\]]+)\]/g, '<span class="oku">$1</span>');
}

// 枠の中に線(path)を1本作る
function makePath(d, className) {
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  path.setAttribute("class", className);
  return path;
}

function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }


// ---------- 言語 ----------
// 前に選んだ言語があればそれ。なければスマホの言語(日本語/英語/スペイン語以外は日本語)
let langChosen = false;  // 言語を選んだことがあるか。ないときは、一覧の前に言語を聞く
let lang = loadLang();

function loadLang() {
  try {
    const saved = localStorage.getItem("lang");
    if (UI[saved]) {
      langChosen = true;
      return saved;
    }
  } catch (e) { /* 保存できない環境でも動くように */ }
  const deviceLang = (navigator.language || "ja").slice(0, 2);
  return UI[deviceLang] ? deviceLang : "ja";
}

function setLang(newLang) {
  lang = newLang;
  langChosen = true;
  try { localStorage.setItem("lang", newLang); } catch (e) {}
  renderList();
}


// ---------- 画面の切り替え ----------
// URLの # に漢字を入れる(例: #行)。スマホの「戻る」でも一覧に戻れる
let cameFromList = false;  // 一覧から開いたか
let listScrollY = 0;       // 一覧のスクロール位置(戻ったときに元の位置へ)

function route() {
  const k = decodeURIComponent(location.hash.slice(1));
  const item = KANJI.find(function (x) { return x.k === k; });
  if (item) {
    showKanji(item);
  } else {
    showList();
  }
}

function goBack() {
  if (cameFromList) {
    history.back();
  } else {
    location.hash = "";
  }
}


// ---------- 画面1: 一覧 ----------
// 画数の少ない順(画数は STROKES の画の数)。同じ画数は KANJI の並びのまま
function sortedKanji() {
  return KANJI.slice().sort(function (a, b) { return STROKES[a.k].length - STROKES[b.k].length; });
}

function showList() {
  stopAnimation();
  cameFromList = false;
  $("kanji-screen").classList.add("hidden");
  // 言語をまだ選んでいないときは、一覧の代わりに言語を聞く画面を出す
  $("lang-screen").classList.toggle("hidden", langChosen);
  $("list-screen").classList.toggle("hidden", !langChosen);
  if (!langChosen) {
    window.scrollTo(0, 0);
    return;
  }
  renderList();
  window.scrollTo(0, listScrollY);
}

function renderList() {
  // 言語のボタン: 選んでいるものに下線を付ける
  document.querySelectorAll("#lang-switch button").forEach(function (button) {
    button.classList.toggle("active", button.dataset.lang === lang);
  });

  // 漢字のリスト(左に漢字と読み、右に画数)
  let html = "";
  for (const item of sortedKanji()) {
    html += '<li><button data-k="' + item.k + '">' +
              '<span class="k">' + item.k + '</span>' +
              '<span class="y">' + escapeHtml(item.yomi) + '</span>' +
              '<span class="n">' + STROKES[item.k].length + UI[lang].strokes + '</span>' +
            '</button></li>';
  }
  $("kanji-list").innerHTML = html;

  $("credit-text").textContent = UI[lang].credit;
}


// ---------- 画面2: 漢字の画面 ----------
let current = null;        // 今開いている漢字のデータ
let mode = "see";          // "see"(見る) か "write"(書く)

function showKanji(item) {
  if (!$("kanji-screen").classList.contains("hidden") && current === item) return;
  current = item;
  if ($("list-screen").classList.contains("hidden")) {
    cameFromList = false;            // 一覧以外(URLを直接開いたなど)から来た
  } else {
    listScrollY = window.scrollY;
  }
  $("lang-screen").classList.add("hidden");
  $("list-screen").classList.add("hidden");
  $("kanji-screen").classList.remove("hidden");
  window.scrollTo(0, 0);

  const t = UI[lang];
  $("back-btn").textContent = t.back;
  // 1行目(意味)は日本語のときは出さない。どちらも前に小さい見出しを付ける
  $("meaning").classList.toggle("hidden", lang === "ja");
  $("meaning").innerHTML = '<span class="tag">' + escapeHtml(t.meaning) + '</span>' + escapeHtml(item.mean[lang]);
  $("reading").innerHTML = '<span class="tag">' + escapeHtml(t.reading) + '</span>' + escapeHtml(item.yomi);
  $("tab-see").textContent = t.see;
  $("tab-write").textContent = t.write;
  $("next-btn").textContent = t.next;
  $("clear-btn").textContent = t.clear;

  // 見本: 全部の画を薄いグレーで並べる(書き順のデータは ③ から)
  $("model").innerHTML = "";
  for (const d of STROKES[item.k]) {
    $("model").appendChild(makePath(d, "model-stroke"));
  }

  renderReadings(item);
  setMode("see");
}

// 「見る」と「書く」の切り替え
function setMode(newMode) {
  mode = newMode;
  stopAnimation();
  clearInk();
  modelVisible = true;

  $("tab-see").classList.toggle("active", mode === "see");
  $("tab-write").classList.toggle("active", mode === "write");
  $("see-controls").classList.toggle("hidden", mode !== "see");
  $("write-controls").classList.toggle("hidden", mode !== "write");
  $("frame").classList.toggle("writing", mode === "write");
  $("start-btn").textContent = UI[lang].start;
  updateModel();
}


// ---------- 見る: 書き順のアニメ ----------
let animId = 0;  // アニメを始めるたび・止めるたびに増やす(古いアニメを止めるため)

function stopAnimation() {
  animId++;
  $("anim").innerHTML = "";
}

async function playAnimation() {
  stopAnimation();
  const myId = animId;
  $("start-btn").textContent = UI[lang].again;

  for (const d of STROKES[current.k]) {
    const path = makePath(d, "anim-stroke");
    $("anim").appendChild(path);
    const length = path.getTotalLength();
    // 線を「点線の1本目」にして、少しずつ見せていく
    path.style.strokeDasharray = length + " " + length;
    path.style.strokeDashoffset = length;

    const finished = await drawStroke(path, length, Math.max(300, length * 12), myId);
    if (!finished) return;          // 途中で止められた
    await wait(150);                // 1画ごとの間
    if (myId !== animId) return;
  }
}

// 1画を duration ミリ秒かけて書く。途中で止められたら false
function drawStroke(path, length, duration, myId) {
  return new Promise(function (resolve) {
    const startTime = performance.now();
    function step(now) {
      if (myId !== animId) return resolve(false);
      const progress = Math.min(1, (now - startTime) / duration);
      path.style.strokeDashoffset = length * (1 - progress);
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        resolve(true);
      }
    }
    requestAnimationFrame(step);
  });
}


// ---------- 書く: 指でなぞる ----------
let strokeCount = 0;       // 書いた画の数
let modelVisible = true;   // 見本を出しているか
let drawing = null;        // いま書いている線

// 見本の表示を更新する。書くときは「次に書く画」だけ色を変える
// (合っているかの判定はしない。画数より多く書いたら、色の変わる画がなくなるだけ)
function updateModel() {
  $("model").style.display = (mode === "write" && !modelVisible) ? "none" : "";
  $("model-btn").textContent = modelVisible ? UI[lang].hideModel : UI[lang].showModel;

  const paths = $("model").children;
  for (let i = 0; i < paths.length; i++) {
    paths[i].classList.toggle("next", mode === "write" && i === strokeCount);
  }
}

// 指の位置(画面の座標)を、枠の中の座標(0〜109)に変える
function toFramePoint(e) {
  const matrix = $("frame").getScreenCTM().inverse();
  const point = new DOMPoint(e.clientX, e.clientY).matrixTransform(matrix);
  return point.x.toFixed(1) + " " + point.y.toFixed(1);
}

function onPointerDown(e) {
  if (mode !== "write") return;
  e.preventDefault();
  $("frame").setPointerCapture(e.pointerId);
  const p = toFramePoint(e);
  drawing = { d: "M" + p + " L" + p };
  drawing.path = makePath(drawing.d, "ink-stroke");
  $("ink").appendChild(drawing.path);
}

function onPointerMove(e) {
  if (!drawing) return;
  drawing.d += " " + toFramePoint(e);
  drawing.path.setAttribute("d", drawing.d);
}

function onPointerUp() {
  if (!drawing) return;
  drawing = null;
  strokeCount++;   // 指を離したら1画
  updateModel();
  if (strokeCount === STROKES[current.k].length) showRelated();  // 画数ぶん書き終わった
}

// 「消す」: 書いた線を消して1画目に戻る(別の字に移るときも、ここを通る)
function clearInk() {
  drawing = null;
  strokeCount = 0;
  $("ink").innerHTML = "";
  $("related").classList.add("hidden");
}


// ---------- 書き終わったら: 次はこれ ----------
// 関連する字を3つ選ぶ。同じグループの中で、今の字の次から順に(最後まで行ったら先頭へ)。
// 複数のグループに入る字は、グループから交互に1つずつ。3つに足りなければ、一覧で次の字で埋める
function relatedKanji(k) {
  const lists = Object.values(GROUPS)
    .map(function (members) { return Array.from(members); })
    .filter(function (members) { return members.includes(k); })
    .map(function (members) {
      const i = members.indexOf(k);
      return members.slice(i + 1).concat(members.slice(0, i));
    });

  const picked = [];
  function add(c) {
    const item = KANJI.find(function (x) { return x.k === c; });
    if (item && c !== k && picked.length < 3 && !picked.includes(item)) picked.push(item);
  }

  const longest = Math.max(0, ...lists.map(function (list) { return list.length; }));
  for (let n = 0; n < longest; n++) {
    for (const list of lists) add(list[n]);
  }

  const order = sortedKanji();
  const at = order.findIndex(function (x) { return x.k === k; });
  for (let n = 1; n < order.length; n++) add(order[(at + n) % order.length].k);

  return picked;
}

// 意味を短くする(最初の「。」「;」「(」より前だけ)
function shortMeaning(item) {
  return item.mean[lang].split(/[。;(（]/)[0].trim();
}

function showRelated() {
  $("related-title").textContent = UI[lang].related;
  let html = "";
  for (const item of relatedKanji(current.k)) {
    html += '<button data-k="' + item.k + '">' +
              '<span class="rk">' + item.k + '</span>' +
              '<span class="rm">' + escapeHtml(shortMeaning(item)) + '</span>' +
            '</button>';
  }
  $("related-list").innerHTML = html;
  $("related").classList.remove("hidden");
}


// ---------- 下の部分: 音読み・訓読み・例文 ----------
function renderReadings(item) {
  const t = UI[lang];
  $("on-title").textContent = t.on;
  $("kun-title").textContent = t.kun;
  $("ex-title").textContent = t.ex;

  // 例の言葉(日本語のときは訳なし)
  function wordsHtml(words) {
    let html = "";
    for (const word of words) {
      html += '<span class="word">' + toRuby(word.w);
      if (lang !== "ja") html += ' <span class="tr">' + escapeHtml(word[lang]) + '</span>';
      html += '</span>';
    }
    return html;
  }

  // 1行目に「番号+読み」、2行目に単語(読みの左端にそろえる)
  function readingRowHtml(label, yomiHtml, secondLineHtml) {
    return '<div class="yomi-row"><span class="tag">' + label + '</span>' +
           '<div class="yomi-body"><div class="yomi">' + yomiHtml + '</div>' +
           (secondLineHtml ? '<div class="words">' + secondLineHtml + '</div>' : '') +
           '</div></div>';
  }

  // 音読みと例の言葉。見出し(コウ など)に「音1」「音2」を付ける(漢字ごとに1から)
  let onHtml = "";
  item.on.forEach(function (on, i) {
    onHtml += readingRowHtml("音" + (i + 1), escapeHtml(on.yomi), wordsHtml(on.words));
  });
  $("on-list").innerHTML = onHtml || '<div class="empty">' + t.none + '</div>';

  // 訓読み。見出しに「訓1」「訓2」を付ける。赤くするのは読み(1行目)の送り仮名だけ
  let kunHtml = "";
  item.kun.forEach(function (kun, i) {
    const words = kun.words || [];
    const hasOkurigana = kun.forms.indexOf("[") >= 0;
    // 送り仮名がなくて単語があるときは、漢字1字(野 など)は出さず、単語だけを出す
    const formsHtml = (hasOkurigana || words.length === 0)
      ? '<span class="forms">' + escapeHtml(kun.forms.replace(/[\[\]]/g, "")) + '</span>'
      : "";
    kunHtml += readingRowHtml("訓" + (i + 1), toOkurigana(kun.yomi), formsHtml + wordsHtml(words));
  });
  $("kun-list").innerHTML = kunHtml || '<div class="empty">' + t.none + '</div>';

  // 例文(漢字の上にふりがな、下に訳。日本語のときは訳なし)。前に「例1」「例2」を付ける
  let exHtml = "";
  item.ex.forEach(function (sentence, i) {
    exHtml += '<div class="sentence"><div class="ja"><span class="tag">例' + (i + 1) + '</span>' + toRuby(sentence.ja) + '</div>';
    if (lang !== "ja") exHtml += '<div class="tr">' + escapeHtml(sentence[lang]) + '</div>';
    exHtml += '</div>';
  });
  $("ex-list").innerHTML = exHtml || '<div class="empty">' + t.noEx + '</div>';
}


// ---------- ボタンと指の動きをつなぐ ----------
function start() {
  // はじめの画面: 選んだ言語を保存して、一覧を出す
  $("lang-choices").addEventListener("click", function (e) {
    const button = e.target.closest("button");
    if (!button) return;
    setLang(button.dataset.lang);
    showList();
  });
  $("lang-switch").addEventListener("click", function (e) {
    const button = e.target.closest("button");
    if (button) setLang(button.dataset.lang);
  });
  $("kanji-list").addEventListener("click", function (e) {
    const button = e.target.closest("button");
    if (!button) return;
    cameFromList = true;
    location.hash = encodeURIComponent(button.dataset.k);
  });
  $("back-btn").addEventListener("click", goBack);
  $("tab-see").addEventListener("click", function () { setMode("see"); });
  $("tab-write").addEventListener("click", function () { setMode("write"); });
  $("start-btn").addEventListener("click", playAnimation);
  $("next-btn").addEventListener("click", function () { setMode("write"); });
  $("model-btn").addEventListener("click", function () { modelVisible = !modelVisible; updateModel(); });
  $("clear-btn").addEventListener("click", function () { clearInk(); updateModel(); });
  // 「次はこれ」の字をタップしたら、その字の画面(見る)へ
  $("related-list").addEventListener("click", function (e) {
    const button = e.target.closest("button");
    if (button) location.hash = encodeURIComponent(button.dataset.k);
  });

  const frame = $("frame");
  frame.addEventListener("pointerdown", onPointerDown);
  frame.addEventListener("pointermove", onPointerMove);
  frame.addEventListener("pointerup", onPointerUp);
  frame.addEventListener("pointercancel", onPointerUp);

  window.addEventListener("hashchange", route);
  route();
}

document.addEventListener("DOMContentLoaded", start);
</script>
