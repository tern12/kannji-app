<style>
  /* ===== 全体 ===== */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    color: #222;
    background: #fafafa;
    -webkit-text-size-adjust: 100%;
  }
  .screen { max-width: 480px; margin: 0 auto; padding: 12px 16px 40px; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }

  /* ===== 画面1: 一覧 ===== */
  .lang-switch, .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .lang-switch button, .tabs button {
    flex: 1; padding: 10px 0; border: 1px solid #ccc; background: #fff; border-radius: 8px;
  }
  .lang-switch button.active, .tabs button.active { background: #333; color: #fff; border-color: #333; }

  .kanji-list { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 8px; }
  .kanji-list li + li { border-top: 1px solid #eee; }
  .kanji-list button {
    display: flex; align-items: center; width: 100%;
    padding: 10px 16px; border: 0; background: none; text-align: left;
  }
  .kanji-list .k { font-size: 32px; width: 60px; }
  .kanji-list .y { color: #555; }

  .credit { margin-top: 20px; font-size: 12px; color: #777; line-height: 1.6; }
  .credit a { color: #777; }

  /* ===== 画面2: 漢字の画面 ===== */
  .back { border: 0; background: none; padding: 8px 0; color: #2a62c9; }
  .head { margin: 4px 0 12px; }
  .meaning { font-size: 20px; font-weight: bold; }
  .reading { color: #555; margin-top: 4px; }

  /* 大きい枠(見ると書くで同じ枠を使う) */
  #frame {
    display: block; width: 100%; max-width: 360px; aspect-ratio: 1 / 1; margin: 0 auto;
    background: #fff; border: 2px solid #999; border-radius: 4px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #frame.writing { touch-action: none; } /* 書くときは、指で画面がスクロールしないように */
  #frame .guide { stroke: #bbb; stroke-width: 0.6; stroke-dasharray: 2 2; }
  #frame path { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  #frame .model-stroke { stroke: #ddd; }           /* 見本(薄いグレー) */
  #frame .model-stroke.next { stroke: #f2a65a; }   /* 次に書く画 */
  #frame .anim-stroke { stroke: #222; }            /* アニメの線 */
  #frame .ink-stroke { stroke: #2a62c9; }          /* 自分で書いた線 */

  .controls { display: flex; gap: 8px; justify-content: center; margin: 12px 0 8px; }
  .controls button { min-width: 120px; padding: 10px 14px; border: 1px solid #ccc; background: #fff; border-radius: 8px; }

  /* 読み・例文 */
  h2 { font-size: 16px; margin: 24px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #ddd; }
  .yomi-row { margin: 8px 0; line-height: 2; }
  .yomi { font-weight: bold; margin-right: 12px; }
  .word { display: inline-block; margin-right: 16px; }
  .tr { color: #666; font-size: 14px; }
  .oku { color: #d9534f; }                           /* 送り仮名の色 */
  .sentence { margin: 12px 0; }
  .sentence .ja { font-size: 18px; line-height: 2.2; }
  rt { font-size: 0.55em; color: #555; }
  .empty { color: #999; }
</style>
</head>
<body>

<!-- ===== 画面1: 一覧 ===== -->

    KanjiVG © Ulrich Apel ·

    <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>

<script>
// =====================================================
// ② アプリの動き
// =====================================================

// ---------- 小さな道具 ----------
function $(id) { return document.getElementById(id); }

function escapeHtml(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// {漢字|ふりがな} を <ruby> に変える
function toRuby(text) {
  return escapeHtml(text).replace(/\{([^|}]+)\|([^}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
}

// 行[く] の [ ] の中(送り仮名)に色を付ける
function toOkurigana(text) {
  return escapeHtml(text).replace(/\[([^\]]+)\]/g, '<span class="oku">$1</span>');
}

// 枠の中に線(path)を1本作る
function makePath(d, className) {
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  path.setAttribute("class", className);
  return path;
}

function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }


// ---------- 言語 ----------
// 前に選んだ言語があればそれ。なければスマホの言語(日本語/英語/スペイン語以外は日本語)
let lang = loadLang();

function loadLang() {
  try {
    const saved = localStorage.getItem("lang");
    if (UI[saved]) return saved;
  } catch (e) { /* 保存できない環境でも動くように */ }
  const deviceLang = (navigator.language || "ja").slice(0, 2);
  return UI[deviceLang] ? deviceLang : "ja";
}

function setLang(newLang) {
  lang = newLang;
  try { localStorage.setItem("lang", newLang); } catch (e) {}
  renderList();
}


// ---------- 画面の切り替え ----------
// URLの # に漢字を入れる(例: #行)。スマホの「戻る」でも一覧に戻れる
let cameFromList = false;  // 一覧から開いたか
let listScrollY = 0;       // 一覧のスクロール位置(戻ったときに元の位置へ)

function route() {
  const k = decodeURIComponent(location.hash.slice(1));
  const item = KANJI.find(function (x) { return x.k === k; });
  if (item) {
    showKanji(item);
  } else {
    showList();
  }
}

function goBack() {
  if (cameFromList) {
    history.back();
  } else {
    location.hash = "";
  }
}


// ---------- 画面1: 一覧 ----------
function showList() {
  stopAnimation();
  cameFromList = false;
  $("kanji-screen").classList.add("hidden");
  $("list-screen").classList.remove("hidden");
  renderList();
  window.scrollTo(0, listScrollY);
}

function renderList() {
  // 言語のボタン: 選んでいるものを黒にする
  document.querySelectorAll("#lang-switch button").forEach(function (button) {
    button.classList.toggle("active", button.dataset.lang === lang);
  });

  // 20行のリスト(左に漢字、右に読み)
  let html = "";
  for (const item of KANJI) {
    html += '<li><button data-k="' + item.k + '">' +
              '<span class="k">' + item.k + '</span>' +
              '<span class="y">' + escapeHtml(item.yomi) + '</span>' +
            '</button></li>';
  }
  $("kanji-list").innerHTML = html;

  $("credit-text").textContent = UI[lang].credit;
}


// ---------- 画面2: 漢字の画面 ----------
let current = null;        // 今開いている漢字のデータ
let mode = "see";          // "see"(見る) か "write"(書く)

function showKanji(item) {
  if (!$("kanji-screen").classList.contains("hidden") && current === item) return;
  current = item;
  if ($("list-screen").classList.contains("hidden")) {
    cameFromList = false;            // 一覧以外(URLを直接開いたなど)から来た
  } else {
    listScrollY = window.scrollY;
  }
  $("list-screen").classList.add("hidden");
  $("kanji-screen").classList.remove("hidden");
  window.scrollTo(0, 0);

  const t = UI[lang];
  $("back-btn").textContent = t.back;
  $("meaning").textContent = item.mean[lang];
  $("reading").textContent = item.yomi;
  $("tab-see").textContent = t.see;
  $("tab-write").textContent = t.write;
  $("next-btn").textContent = t.next;
  $("clear-btn").textContent = t.clear;

  // 見本: 全部の画を薄いグレーで並べる(書き順のデータは ③ から)
  $("model").innerHTML = "";
  for (const d of STROKES[item.k]) {
    $("model").appendChild(makePath(d, "model-stroke"));
  }

  renderReadings(item);
  setMode("see");
}

// 「見る」と「書く」の切り替え
function setMode(newMode) {
  mode = newMode;
  stopAnimation();
  clearInk();
  modelVisible = true;

  $("tab-see").classList.toggle("active", mode === "see");
  $("tab-write").classList.toggle("active", mode === "write");
  $("see-controls").classList.toggle("hidden", mode !== "see");
  $("write-controls").classList.toggle("hidden", mode !== "write");
  $("frame").classList.toggle("writing", mode === "write");
  $("start-btn").textContent = UI[lang].start;
  updateModel();
}


// ---------- 見る: 書き順のアニメ ----------
let animId = 0;  // アニメを始めるたび・止めるたびに増やす(古いアニメを止めるため)

function stopAnimation() {
  animId++;
  $("anim").innerHTML = "";
}

async function playAnimation() {
  stopAnimation();
  const myId = animId;
  $("start-btn").textContent = UI[lang].again;

  for (const d of STROKES[current.k]) {
    const path = makePath(d, "anim-stroke");
    $("anim").appendChild(path);
    const length = path.getTotalLength();
    // 線を「点線の1本目」にして、少しずつ見せていく
    path.style.strokeDasharray = length + " " + length;
    path.style.strokeDashoffset = length;

    const finished = await drawStroke(path, length, Math.max(300, length * 12), myId);
    if (!finished) return;          // 途中で止められた
    await wait(150);                // 1画ごとの間
    if (myId !== animId) return;
  }
}

// 1画を duration ミリ秒かけて書く。途中で止められたら false
function drawStroke(path, length, duration, myId) {
  return new Promise(function (resolve) {
    const startTime = performance.now();
    function step(now) {
      if (myId !== animId) return resolve(false);
      const progress = Math.min(1, (now - startTime) / duration);
      path.style.strokeDashoffset = length * (1 - progress);
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        resolve(true);
      }
    }
    requestAnimationFrame(step);
  });
}


// ---------- 書く: 指でなぞる ----------
let strokeCount = 0;       // 書いた画の数
let modelVisible = true;   // 見本を出しているか
let drawing = null;        // いま書いている線

// 見本の表示を更新する。書くときは「次に書く画」だけ色を変える
// (合っているかの判定はしない。画数より多く書いたら、色の変わる画がなくなるだけ)
function updateModel() {
  $("model").style.display = (mode === "write" && !modelVisible) ? "none" : "";
  $("model-btn").textContent = modelVisible ? UI[lang].hideModel : UI[lang].showModel;

  const paths = $("model").children;
  for (let i = 0; i < paths.length; i++) {
    paths[i].classList.toggle("next", mode === "write" && i === strokeCount);
  }
}

// 指の位置(画面の座標)を、枠の中の座標(0〜109)に変える
function toFramePoint(e) {
  const matrix = $("frame").getScreenCTM().inverse();
  const point = new DOMPoint(e.clientX, e.clientY).matrixTransform(matrix);
  return point.x.toFixed(1) + " " + point.y.toFixed(1);
}

function onPointerDown(e) {
  if (mode !== "write") return;
  e.preventDefault();
  $("frame").setPointerCapture(e.pointerId);
  const p = toFramePoint(e);
  drawing = { d: "M" + p + " L" + p };
  drawing.path = makePath(drawing.d, "ink-stroke");
  $("ink").appendChild(drawing.path);
}

function onPointerMove(e) {
  if (!drawing) return;
  drawing.d += " " + toFramePoint(e);
  drawing.path.setAttribute("d", drawing.d);
}

function onPointerUp() {
  if (!drawing) return;
  drawing = null;
  strokeCount++;   // 指を離したら1画
  updateModel();
}

// 「消す」: 書いた線を消して1画目に戻る
function clearInk() {
  drawing = null;
  strokeCount = 0;
  $("ink").innerHTML = "";
}


// ---------- 下の部分: 音読み・訓読み・例文 ----------
function renderReadings(item) {
  const t = UI[lang];
  $("on-title").textContent = t.on;
  $("kun-title").textContent = t.kun;
  $("ex-title").textContent = t.ex;

  // 音読みと例の言葉(日本語のときは訳なし)
  let onHtml = "";
  for (const on of item.on) {
    onHtml += '<div class="yomi-row"><span class="yomi">' + escapeHtml(on.yomi) + '</span>';
    for (const word of on.words) {
      onHtml += '<span class="word">' + toRuby(word.w);
      if (lang !== "ja") onHtml += ' <span class="tr">' + escapeHtml(word[lang]) + '</span>';
      onHtml += '</span>';
    }
    onHtml += '</div>';
  }
  $("on-list").innerHTML = onHtml || '<div class="empty">' + t.none + '</div>';

  // 訓読み(送り仮名に色)
  let kunHtml = "";
  for (const kun of item.kun) {
    kunHtml += '<div class="yomi-row"><span class="yomi">' + escapeHtml(kun.yomi) + '</span>' +
               toOkurigana(kun.forms) + '</div>';
  }
  $("kun-list").innerHTML = kunHtml || '<div class="empty">' + t.none + '</div>';

  // 例文(漢字の上にふりがな、下に訳。日本語のときは訳なし)
  let exHtml = "";
  for (const sentence of item.ex) {
    exHtml += '<div class="sentence"><div class="ja">' + toRuby(sentence.ja) + '</div>';
    if (lang !== "ja") exHtml += '<div class="tr">' + escapeHtml(sentence[lang]) + '</div>';
    exHtml += '</div>';
  }
  $("ex-list").innerHTML = exHtml || '<div class="empty">' + t.noEx + '</div>';
}


// ---------- ボタンと指の動きをつなぐ ----------
function start() {
  $("lang-switch").addEventListener("click", function (e) {
    const button = e.target.closest("button");
    if (button) setLang(button.dataset.lang);
  });
  $("kanji-list").addEventListener("click", function (e) {
    const button = e.target.closest("button");
    if (!button) return;
    cameFromList = true;
    location.hash = encodeURIComponent(button.dataset.k);
  });
  $("back-btn").addEventListener("click", goBack);
  $("tab-see").addEventListener("click", function () { setMode("see"); });
  $("tab-write").addEventListener("click", function () { setMode("write"); });
  $("start-btn").addEventListener("click", playAnimation);
  $("next-btn").addEventListener("click", function () { setMode("write"); });
  $("model-btn").addEventListener("click", function () { modelVisible = !modelVisible; updateModel(); });
  $("clear-btn").addEventListener("click", function () { clearInk(); updateModel(); });

  const frame = $("frame");
  frame.addEventListener("pointerdown", onPointerDown);
  frame.addEventListener("pointermove", onPointerMove);
  frame.addEventListener("pointerup", onPointerUp);
  frame.addEventListener("pointercancel", onPointerUp);

  window.addEventListener("hashchange", route);
  route();
}

document.addEventListener("DOMContentLoaded", start);
</script>
